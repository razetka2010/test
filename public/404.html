<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Страница не найдена | Знание Севера</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/styles.css">
    <style>
        .error-page { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 32px; background: linear-gradient(135deg, var(--ice), var(--white)); }
        .error-page h1 { font-size: clamp(5rem, 16vw, 10rem); line-height: 1; color: var(--primary); }
        .error-page h2 { margin: 16px 0 10px; color: var(--primary); }
        .error-page p { max-width: 440px; margin: 0 auto 24px; color: var(--text-light); }
    </style>
</head>
<body>
    <main class="error-page">
        <div>
            <i class="fas fa-compass" aria-hidden="true"></i>
            <h1>404</h1>
            <h2>Страница не найдена</h2>
            <p>Похоже, такой страницы больше нет или адрес был указан с ошибкой.</p>
            <a class="btn btn-primary" href="/">Вернуться на главную</a>
        </div>
    </main> 
</body>
</html>
