<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Спасибо за заявку | Знание Севера</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/styles.css">
    <style>
        .thanks-page { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 32px; background: linear-gradient(135deg, var(--ice), var(--white)); }
        .thanks-page > div { max-width: 560px; }
        .thanks-page i { font-size: 4rem; color: var(--accent); }
        .thanks-page h1 { margin: 20px 0 12px; color: var(--primary); }
        .thanks-page p { margin-bottom: 24px; color: var(--text-light); }
    </style>
</head>
<body>
    <main class="thanks-page">
        <div>
            <i class="fas fa-check-circle" aria-hidden="true"></i>
            <h1>Спасибо за заявку!</h1>
            <p>Мы получили ваши данные и свяжемся с вами в ближайшее время.</p>
            <a class="btn btn-primary" href="/careers.html">Вернуться к вакансиям</a>
        </div>
    </main>
</body>
</html>
