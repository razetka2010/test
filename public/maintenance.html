<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Техническое обслуживание | Знание Севера</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0b3b5f 0%, #1e5a7d 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }

        /* Анимированный фон */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .bg-animation .snowflake {
            position: absolute;
            top: -10px;
            color: rgba(255, 255, 255, 0.15);
            user-select: none;
            pointer-events: none;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0.3;
            }
        }

        /* Частицы */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            animation: float 20s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) translateX(0);
            }
            25% {
                transform: translateY(-30px) translateX(20px);
            }
            50% {
                transform: translateY(20px) translateX(-20px);
            }
            75% {
                transform: translateY(-20px) translateX(-10px);
            }
        }

        /* Основной контейнер */
        .maintenance-container {
            position: relative;
            z-index: 1;
            max-width: 600px;
            margin: 40px 20px;
            text-align: center;
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Иконка с анимацией */
        .icon-wrapper {
            margin-bottom: 30px;
        }

        .maintenance-icon {
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            animation: pulse 2s infinite;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(59, 158, 255, 0.4);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 0 0 20px rgba(59, 158, 255, 0);
            }
        }

        .maintenance-icon i {
            font-size: 4rem;
            color: white;
        }

        /* Тайтл */
        h1 {
            font-size: 3rem;
            font-weight: 800;
            color: white;
            margin-bottom: 16px;
            letter-spacing: -0.02em;
        }

        .highlight {
            background: linear-gradient(135deg, #3b9eff, #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Описание */
        .description {
            font-size: 1.125rem;
            color: rgba(255, 255, 255, 0.85);
            line-height: 1.6;
            margin-bottom: 32px;
        }

        /* Статус */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 193, 7, 0.2);
            padding: 8px 20px;
            border-radius: 50px;
            margin-bottom: 32px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background: #ffc107;
            border-radius: 50%;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }

        .status-text {
            color: #ffc107;
            font-weight: 500;
        }

        /* Кнопки */
        .buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 32px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 32px;
            border-radius: 12px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            font-size: 1rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3b9eff, #2b7bd0);
            color: white;
            box-shadow: 0 4px 15px rgba(59, 158, 255, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(59, 158, 255, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-outline {
            background: transparent;
            border: 2px solid rgba(255, 255, 255, 0.5);
            color: white;
        }

        .btn-outline:hover {
            border-color: white;
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        /* Социальные ссылки */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 32px;
        }

        .social-link {
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .social-link:hover {
            background: #3b9eff;
            transform: translateY(-4px);
        }

        /* Копирайт */
        .copyright {
            margin-top: 48px;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.4);
        }

        /* Уведомление */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 0.875rem;
            z-index: 100;
            transition: transform 0.3s ease;
            backdrop-filter: blur(10px);
            white-space: nowrap;
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }
            
            .buttons {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                width: 100%;
                justify-content: center;
            }
            
            .toast {
                white-space: normal;
                max-width: 90%;
                text-align: center;
            }
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="bg-animation" id="snowContainer"></div>
    <div class="particles" id="particlesContainer"></div>

    <div class="maintenance-container">
        <div class="icon-wrapper">
            <div class="maintenance-icon">
                <i class="fas fa-tools"></i>
            </div>
        </div>

        <h1>
            <span class="highlight">Технические</span><br>
            работы
        </h1>

        <div class="description">
            <p>Мы проводим плановое обновление сервера и системы.<br>
            Сайт будет доступен в ближайшее время. Приносим извинения за временные неудобства.</p>
        </div>

        <div class="status-badge">
            <div class="status-dot"></div>
            <span class="status-text" id="statusText">Идут технические работы</span>
        </div>

        <div class="buttons">
            <button class="btn btn-primary" onclick="checkStatusManually()" id="checkBtn">
                <i class="fas fa-sync-alt"></i> Проверить статус
            </button>
            <a href="https://t.me/znaniesevera" target="_blank" class="btn btn-outline">
                <i class="fab fa-telegram"></i> Связаться в Telegram
            </a>
        </div>

        <div class="social-links">
            <a href="https://t.me/znaniesevera" target="_blank" class="social-link">
                <i class="fab fa-telegram"></i>
            </a>
            <a href="https://github.com/razetka2010" target="_blank" class="social-link">
                <i class="fab fa-github"></i>
            </a>
            <a href="mailto:znaniesevera.offical@gmail.com" class="social-link">
                <i class="fas fa-envelope"></i>
            </a>
        </div>

        <div class="copyright">
            <p>© 2026 Корпорация «Знание Севера». Все права защищены.</p>
        </div>
    </div>

    <div class="toast" id="toast">Проверка статуса...</div>

    <script>
        let isChecking = false;
        
        // Создание снежинок
        function createSnowflakes() {
            const container = document.getElementById('snowContainer');
            const snowflakeCount = 50;
            
            for (let i = 0; i < snowflakeCount; i++) {
                const snowflake = document.createElement('div');
                snowflake.className = 'snowflake';
                snowflake.innerHTML = ['❄️', '❄️', '❄️', '⭐', '✨'][Math.floor(Math.random() * 5)];
                snowflake.style.left = Math.random() * 100 + '%';
                snowflake.style.fontSize = (Math.random() * 20 + 10) + 'px';
                snowflake.style.animationDuration = (Math.random() * 5 + 5) + 's';
                snowflake.style.animationDelay = (Math.random() * 5) + 's';
                snowflake.style.opacity = Math.random() * 0.5 + 0.2;
                container.appendChild(snowflake);
            }
        }

        // Создание частиц
        function createParticles() {
            const container = document.getElementById('particlesContainer');
            const particleCount = 30;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.width = (Math.random() * 100 + 50) + 'px';
                particle.style.height = particle.style.width;
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = (Math.random() * 20) + 's';
                particle.style.animationDuration = (Math.random() * 20 + 15) + 's';
                container.appendChild(particle);
            }
        }
        
        // Показать уведомление
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.background = isError ? 'rgba(220, 53, 69, 0.9)' : 'rgba(0,0,0,0.8)';
            toast.style.transform = 'translateX(-50%) translateY(0)';
            
            setTimeout(() => {
                toast.style.transform = 'translateX(-50%) translateY(100px)';
                setTimeout(() => {
                    toast.style.background = 'rgba(0,0,0,0.8)';
                }, 300);
            }, 3000);
        }
        
        // Анимация кнопки проверки
        function animateCheckButton(loading) {
            const btn = document.getElementById('checkBtn');
            const icon = btn.querySelector('i');
            
            if (loading) {
                btn.disabled = true;
                icon.style.animation = 'spin 1s linear infinite';
                btn.style.opacity = '0.7';
            } else {
                btn.disabled = false;
                icon.style.animation = 'none';
                btn.style.opacity = '1';
            }
        }
        
        // Проверка статуса
        async function checkStatusManually() {
            if (isChecking) {
                showToast('⏳ Проверка уже выполняется...');
                return;
            }
            
            isChecking = true;
            animateCheckButton(true);
            
            try {
                showToast('🔍 Проверяем статус сервера...');
                
                const response = await fetch('/api/maintenance-status', { cache: 'no-store' });
                
                if (!response.ok) {
                    throw new Error('Ошибка сервера');
                }
                
                const settings = await response.json();
                
                // Получаем сохраненный URL для редиректа
                const redirectUrl = sessionStorage.getItem('redirectAfterMaintenance');
                
                // Если режим обслуживания выключен
                if (!settings.maintenance_mode) {
                    showToast('✅ Сайт снова работает! Перенаправление...');
                    if (redirectUrl) {
                        sessionStorage.removeItem('redirectAfterMaintenance');
                        window.location.href = redirectUrl;
                    } else {
                        window.location.href = '/';
                    }
                    return;
                } else {
                    // Режим все еще включен
                    const blockedPages = settings.maintenance_pages || '';
                    const message = blockedPages 
                        ? `Сайт на обслуживании. Заблокированы страницы: ${blockedPages}`
                        : 'Сайт на обслуживании. Пожалуйста, подождите.';
                    showToast(`🛠️ ${message}`);
                    
                    // Обновляем статус
                    const statusText = document.getElementById('statusText');
                    if (blockedPages) {
                        statusText.innerHTML = `Тех. работы (заблокированы: ${blockedPages})`;
                    } else {
                        statusText.innerHTML = 'Идут технические работы';
                    }
                }
            } catch (error) {
                console.error('Ошибка проверки:', error);
                showToast('❌ Не удалось соединиться с сервером. Попробуйте позже.', true);
            } finally {
                isChecking = false;
                animateCheckButton(false);
            }
        }
        
        // Инициализация
        function init() {
            createSnowflakes();
            createParticles();
            
            // Получаем информацию о заблокированных страницах при загрузке
            fetch('/api/maintenance-status', { cache: 'no-store' })
                .then(response => response.json())
                .then(settings => {
                    const blockedPages = settings.maintenance_pages || '';
                    const statusText = document.getElementById('statusText');
                    if (blockedPages && settings.maintenance_mode) {
                        statusText.innerHTML = `Тех. работы (заблокированы: ${blockedPages})`;
                    }
                })
                .catch(err => console.error('Ошибка загрузки настроек:', err));
            
            // Делаем функцию глобальной для кнопки
            window.checkStatusManually = checkStatusManually;
        }
        
        // Запускаем инициализацию
        init();
    </script>
</body>
</html>
