        .article-feature-list {

        }

        .article-feature-icon {

            color: #fff;

            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 18px rgba(35, 104, 165, 0.2);
        }

        .article-stage-image-wrap {
            padding: 18px 20px 10px 0;
            display: flex;
            align-items: center;

        }

        .article-stage-image {

        .article-body {

        .article-category {

        .article-text {

        .article-text > div {

        .article-text a {

        .article-text ul,

            }

            .article-stage-image-wrap {
                padding: 0 18px 18px;
            }

            .article-stage-image {

            }
        }

    <script>
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatContent(text) {
            if (!text) return '<div>Текст отсутствует.</div>';

            const lines = text.split('\n');
            let html = '';
            let lastWasEmpty = false;

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();

                if (!line) {
                    if (!lastWasEmpty) {
                        html += '<div style="height: 12px;"></div>';
                        lastWasEmpty = true;
                    }
                } else if (line.startsWith('•') || line.startsWith('-') || /^\d+\./.test(line)) {
                    const item = line.replace(/^[•\-\d.\s]+/, '');
                    html += `<div style="margin: 8px 0 8px 20px; line-height:1.7;">• ${escapeHtml(item)}</div>`;
                    lastWasEmpty = false;
                } else if (/^https?:\/\//.test(line)) {
                    html += `<div style="margin: 10px 0; line-height: 1.7;"><a href="${escapeHtml(line)}" target="_blank" rel="noopener noreferrer">${escapeHtml(line)}</a></div>`;
                    lastWasEmpty = false;
                } else {
                    html += `<div style="margin: 8px 0; line-height: 1.8;">${escapeHtml(line)}</div>`;
                    lastWasEmpty = false;
                }
            }

            return html;
        }

        async function loadPost() {
            const params = new URLSearchParams(window.location.search);
            const postId = params.get('id');
            const container = document.getElementById('articleContent');

            const fallbackPost = {
                id: 1,
                title: 'С 1 сентября! С днём знаний!',
                category: 'События',
                date: '1 сентября 2026',
                views: 4,
                excerpt: 'Пусть этот учебный год станет для вас началом новых открытий, интересных идей и больших достижений!',
                image_url: 'https://images.unsplash.com/photo-1513258496099-48168024aec0?auto=format&fit=crop&w=1200&q=80',
                content: 'Корпорация «Знание Севера» поздравляет всех школьников, студентов, педагогов и родителей с началом нового учебного года!\n\nПусть этот учебный год станет для вас началом новых открытий, интересных идей, ярких достижений и больших побед!\n\n• Стремитесь к знаниям и не бойтесь задавать вопросы\n• Развивайтесь, мечтайте и верьте в себя\n• Находите друзей и поддержку рядом\n• Двигайтесь вперёд к своим целям'
            };

            function renderPost(post) {
                document.title = `${escapeHtml(post.title)} | Знание Севера`;
                const metaDescription = document.querySelector('meta[name="description"]');
                if (metaDescription) {
                    metaDescription.setAttribute('content', post.excerpt || post.title);
                }

                container.innerHTML = `
                    <article class="article-shell">
                        <div class="article-hero">
                            <a href="blog.html" class="article-back"><i class="fas fa-arrow-left"></i> Назад к блогу</a>
                            <div class="article-meta">
                                <span><span class="meta-icon"></span> ${escapeHtml(post.date || '')}</span>
                                <span><span class="meta-icon"></span> ${post.views || 0} просмотров</span>
                            </div>
                            <h1 class="article-title">${escapeHtml(post.title)}</h1>
                        </div>

                        <div class="article-promo">
                            <div class="article-stage">
                                <div class="article-stage-copy">
                                    <p>${escapeHtml(post.excerpt || '')}</p>
                                    <div class="article-feature-list">
                                        <div class="article-feature-item">
                                            <div class="article-feature-icon"><i class="fas fa-book"></i></div>
                                            <span>Стремитесь к знаниям<br>и не бойтесь задавать вопросы</span>
                                        </div>
                                        <div class="article-feature-item">
                                            <div class="article-feature-icon"><i class="fas fa-star"></i></div>
                                            <span>Развивайтесь, мечтайте<br>и верьте в себя</span>
                                        </div>
                                        <div class="article-feature-item">
                                            <div class="article-feature-icon"><i class="fas fa-users"></i></div>
                                            <span>Находите друзей<br>и поддержку рядом</span>
                                        </div>
                                        <div class="article-feature-item">
                                            <div class="article-feature-icon"><i class="fas fa-trophy"></i></div>
                                            <span>Двигайтесь вперёд<br>к своим целям</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="article-stage-image-wrap">
                                    ${post.image_url ? `<img class="article-stage-image" src="${escapeHtml(post.image_url)}" alt="${escapeHtml(post.title)}">` : '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#dfeefb,#ecf7ff);color:#0e5fad;font-size:4rem;"><i class="fas fa-newspaper"></i></div>'}
                                </div>
                            </div>
                        </div>

                        <div class="article-body">
                            <div class="article-category">${escapeHtml(post.category || 'Новости')}</div>
                            <div class="article-text">${formatContent(post.content)}</div>
                        </div>
                    </article>
                `;
            }

            if (!postId) {
                renderPost(fallbackPost);
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/posts/${postId}`);
                if (!response.ok) {
                    throw new Error('Post not found');
                }

                const post = await response.json();
                renderPost(post);
            } catch (error) {
                console.error('Error loading post:', error);
                renderPost(fallbackPost);
            }
        }

        loadPost();
    </script>
